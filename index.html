r:#fff;border:0}.nav-btn:disabled{opacity:.4;cursor:not-allowed}#pageText{font-weight:700;color:var(--muted);min-width:60px;text-align:center}footer{text-align:center;color:var(--muted);font-size:11px;padding:20px 10px}.bg-orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.22;pointer-events:none;z-index:0;animation:float 10s ease-in-out infinite alternate}.orb1{width:320px;height:320px;background:#ff4ecd;top:7%;left:-100px}.orb2{width:300px;height:300px;background:#38bdf8;right:-80px;top:35%;animation-delay:-3s}.orb3{width:260px;height:260px;background:#8b5cf6;left:45%;bottom:-100px;animation-delay:-6s}@keyframes float{to{transform:translate(35px,-25px) scale(1.12)}}
/* Desktop: place V/F buttons beside each question */
@media(min-width:901px){

/* FINAL V/F BUTTON OVERRIDE: 100% ROUND */
.answer,
button.answer {
  width: 54px !important;
  min-width: 54px !important;

}

/* TOPIC SEARCH — BELOW HEADER */
.search-section{
  width:100%;
  display:flex;
  justify-content:center;
  padding:18px 5% 0;
  position:relative;
  z-index:10;
}
/* TOP TOPIC SEARCH */
.search-box{
  position:relative;
  display:flex;
  align-items:center;
  width:min(320px,34vw);
  height:44px;
}
.search-box input{
  width:100%;
  height:100%;
  border:1px solid var(--line);
  background:var(--card-solid);
  color:var(--text);
  border-radius:22px;
  padding:0 40px 0 40px;
  outline:none;
  font-size:13px;
  transition:.2s;
}
.search-box input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,91,255,.10);
}
.search-icon{
  position:absolute;
  left:14px;
  z-index:2;
  pointer-events:none;
}
.clear-search{
  position:absolute;
  right:8px;
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  display:none;
  font-size:20px;
  line-height:28px;
}
.clear-search:hover{
  background:var(--line);
}
.topic-btn.search-hidden{
  display:none;
}
.search-empty{
  display:none;
  text-align:center;
  padding:20px 10px;
  color:var(--muted);
  font-size:13px;
}
@media(max-width:900px){
  .search-box{width:min(280px,45vw)}
}

    padding:15px 3% 0 !important;

  }

  }

let state = {
  topic:0,
  lang:"it",
  dark:false,
  answers: JSON.parse(localStorage.getItem("patenteAnswers") || "{}")
};

const $ = id => document.getElementById(id);

function save(){localStorage.setItem("patenteAnswers",JSON.stringify(state.answers));}

function key(t,q){return `${t}-${q}`}

function renderTopics(){
  $("topicList").innerHTML = topics.map((t,i)=>`
    <button class="topic-btn ${i===state.topic?'active':''}" data-topic="${i}">
      <span class="topic-num">${i+1}</span>
      <span class="topic-name">${t.title[state.lang]}</span>
      <span class="topic-q">${t.questions.length}</span>
    </button>`).join("");
  document.querySelectorAll(".topic-btn").forEach(b=>b.onclick=()=>{state.topic=+b.dataset.topic;render()});
  $("topicCount").textContent = `${topics.length} ${state.lang==="it"?"Argomenti":state.lang==="ur"?"موضوعات":state.lang==="ps"?"موضوعات":"Topics"}`;
  $("totalCount").textContent = topics.reduce((n,t)=>n+t.questions.length,0);
}

function renderQuestions(){
  const t=topics[state.topic];
  $("questionContainer").innerHTML=t.questions.map((q,i)=>{
    const selected=state.answers[key(state.topic,i)];
    const shown = state.lang==="it" ? q.it : (q[state.lang] || q.en);
    const translation = state.lang==="it" ? "" : `<div class="translation"><b>${state.lang==="ur"?"Italiano / اصل متن":state.lang==="ps"?"ایټالوي اصلي متن":"Italian original"}</b>${q.it}</div>`;
    return `<article class="question-card">
      <div class="question-top"><span class="q-number">${i+1}</span><div class="q-text">${q.code ? `<small class="book-code">${q.code}</small>` : ""}${shown}</div></div>
      <div class="answer-row">
        <div class="answer auto-answer true ${q.a===true?'selected':''}">${state.lang==='en'?'T':'V'}</div>
        <div class="answer auto-answer false ${q.a===false?'selected':''}">F</div>
      </div>${translation}
    </article>`;
  }).join("");
}

function updateStats(){
  const current=topics[state.topic];
  const done=current.questions.length;
  $("progressText").textContent=`${done} / ${current.questions.length}`;
  $("progressBar").style.width="100%";
}

function render(){
  const t=topics[state.topic];
  renderTopics();
  $("topicTitle").textContent=t.title[state.lang] || t.title.en;
  $("topicDescription").textContent=t.desc[state.lang] || t.desc.en;
  $("questionHeading").textContent=state.lang==="it"?"Domande del tema":state.lang==="ur"?"موضوع کے سوالات":state.lang==="ps"?"د موضوع پوښتنې":"Topic Questions";
  $("questionTag").textContent=state.lang==="it"?"DOMANDE":state.lang==="ur"?"سوالات":state.lang==="ps"?"پوښتنې":"QUESTIONS";
  $("progressLabel").textContent=state.lang==="it"?"Progresso":state.lang==="ur"?"پیش رفت":state.lang==="ps"?"پرمختګ":"Progress";
  $("resetText").textContent=state.lang==="it"?"Azzera tema":state.lang==="ur"?"موضوع ری سیٹ کریں":state.lang==="ps"?"موضوع بیا تنظیم کړئ":"Reset Topic";
  $("prevText").textContent=state.lang==="it"?"Tema precedente":state.lang==="ur"?"پچھلا موضوع":state.lang==="ps"?"مخکینی موضوع":"Previous Topic";
  $("nextText").textContent=state.lang==="it"?"Tema successivo":state.lang==="ur"?"اگلا موضوع":state.lang==="ps"?"راتلونکی موضوع":"Next Topic";
  $("pageText").textContent=`${state.topic+1} / ${topics.length}`;
  $("prevBtn").disabled=state.topic===0;$("nextBtn").disabled=state.topic===topics.length-1;
  renderQuestions();updateStats();
}

$("languageSelect").onchange=e=>{state.lang=e.target.value;render()};
$("themeBtn").onclick=()=>{state.dark=!state.dark;document.body.classList.toggle("dark",state.dark);$("themeBtn").textContent=state.dark?"🌙":"☀️";localStorage.setItem("patenteDark",state.dark)};
$("prevBtn").onclick=()=>{if(state.topic>0){state.topic--;render();window.scrollTo({top:0,behavior:"smooth"})}};
$("nextBtn").onclick=()=>{if(state.topic<topics.length-1){state.topic++;render();window.scrollTo({top:0,behavior:"smooth"})}};
$("resetBtn").onclick=()=>{
  topics[state.topic].questions.forEach((_,i)=>delete state.answers[key(state.topic,i)]);
  save();render();
};

state.dark=localStorage.getItem("patenteDark")==="true";
document.body.classList.toggle("dark",state.dark);
$("themeBtn").textContent=state.dark?"🌙":"☀️";
$("languageSelect").value=state.lang;

/* TOPIC SEARCH */
const topicSearch = document.getElementById('topicSearch');
const clearSearch = document.getElementById('clearSearch');

function updateTopicSearch(){
  const query = (topicSearch.value || '').trim().toLocaleLowerCase();
  const buttons = document.querySelectorAll('#topicList .topic-btn');
  let visible = 0;

  buttons.forEach(btn => {
    const name = (btn.querySelector('.topic-name')?.textContent || '').toLocaleLowerCase();
    const match = !query || name.includes(query);
    btn.classList.toggle('search-hidden', !match);
    if(match) visible++;
  });

  clearSearch.style.display = query ? 'block' : 'none';

  // If there is exactly one matching topic, open it automatically.
  if(query && visible === 1){
    const matchBtn = [...buttons].find(btn => !btn.classList.contains('search-hidden'));
    if(matchBtn && !matchBtn.classList.contains('active')) matchBtn.click();
  }
}

topicSearch.addEventListener('input', updateTopicSearch);

clearSearch.addEventListener('click', () => {
  topicSearch.value = '';
  updateTopicSearch();
  topicSearch.focus();
});
