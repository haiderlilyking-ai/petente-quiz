function showTopics(){currentPage='topics';root.innerHTML=`<button class="back" onclick="chapters()">← Back to Chapters</button><section class="hero"><h2>Chapter 1 — Topics</h2><p>Topics are arranged according to the original page number order. Page numbers are used for ordering and are not displayed in topic names.</p></section><div class="grid" id="topicGrid"></div>`; renderTopicGrid(topics)}
function renderTopicGrid(list){const g=document.getElementById('topicGrid'); if(!list.length){g.innerHTML='<div class="empty">No topics found.</div>';return}g.innerHTML=list.map((t,i)=>`<article class="card topic"><div><h3>${i+1}. ${esc(t.name)}</h3><div class="meta">${t.count} questions</div></div><button class="open" onclick='showQuestions(${JSON.stringify(t.name)})'>Open Topic →</button></article>`).join('')}
function showQuestions(topic){currentPage='questions';selectedTopic=topic;const arr=questions.filter(q=>q.topic===topic);root.innerHTML=`<button class="back" onclick="showTopics()">← Back to Topics</button><section class="hero"><h2>${esc(topic)}</h2><p>${arr.length} questions • Vero / Falso</p></section><div class="bar"><input class="search" id="search" placeholder="Search this topic..." oninput="filterQuestions(this.value)"></div><div class="questions" id="questions"></div>`; renderQuestions(arr)}
function renderQuestions(arr){const c=document.getElementById('questions'); if(!arr.length){c.innerHTML='<div class="empty">No questions found.</div>';return}c.innerHTML=arr.map((q,i)=>{const key=q.code+'-'+q.vnum;const sel=state[key]||'';return `<article class="q" id="q-${i}"><div><div class="qid">Question ${i+1} • ${esc(q.code)} V${String(q.vnum).padStart(2,'0')}</div><div class="qtext">${esc(q.question)}</div><div class="pashto-translation"><span class="ps-label">پښتو:</span>${esc(q.pashto)}</div></div><div class="vf"><button class="v ${sel==='Vero'?'selected':''}" onclick="answer('${key}','Vero',this)">V</button><button class="f ${sel==='Falso'?'selected':''}" onclick="answer('${key}','Falso',this)">F</button></div></article>`}).join('')}
function filterQuestions(term){const t=term.toLowerCase();renderQuestions(questions.filter(q=>q.topic===selectedTopic && q.question.toLowerCase().includes(t)))}
function answer(key,val,btn){state[key]=val;save();const box=btn.closest('.vf');box.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');}
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark'))}; if(localStorage.getItem('dark')==='true')document.body.classList.add('dark'); chapters();
</script>
<script id="premium-3d-interaction">
(function(){
  const enableTilt=window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(!enableTilt)return;
  document.addEventListener('mousemove',function(e){
    const card=e.target.closest('.card');
    if(!card)return;
    const r=card.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5;
    const y=(e.clientY-r.top)/r.height-.5;
    card.style.transform='perspective(900px) rotateX('+(-y*3)+'deg) rotateY('+(x*3)+'deg) translateY(-7px)';
  },{passive:true});
  document.addEventListener('mouseleave',function(e){
    const card=e.target.closest && e.target.closest('.card');
    if(card)card.style.transform='';
  },true);
})();
</script>
</body></html>
